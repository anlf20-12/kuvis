name: Build APK
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: "17" }
      - uses: gradle/actions/setup-gradle@v4
      - name: 서명 키 (비밀 값이 있으면 사용)
        env:
          KS: ${{ secrets.KUVIS_KEYSTORE_B64 }}
        run: if [ -n "$KS" ]; then echo "$KS" | base64 -d > app/kuvis.keystore; fi
      - run: chmod +x gradlew && ./gradlew assembleRelease --stacktrace
      - run: |
          cp app/build/outputs/apk/release/app-release.apk kuvis.apk
          cp notify/build/outputs/apk/release/notify-release.apk kuvis-notify-helper.apk
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: 쿠비스 3.1.${{ github.run_number }}
          body: ${{ github.event.head_commit.message }}
          files: |
            kuvis.apk
            kuvis-notify-helper.apk
          make_latest: true
