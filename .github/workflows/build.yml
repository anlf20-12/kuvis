name: Build APK
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: "17" }
      - uses: gradle/actions/setup-gradle@v4
      - name: 서명 키 (비밀 값이 있으면 사용)
        env:
          KS: ${{ secrets.KUVIS_KEYSTORE_B64 }}
        run: if [ -n "$KS" ]; then echo "$KS" | base64 -d > app/kuvis.keystore; fi
      - name: 시계 글꼴 받기 (무료 OFL 한글 글꼴, 못 받으면 기본 글꼴로)
        run: |
          mkdir -p app/src/main/assets/fonts
          B=https://raw.githubusercontent.com/google/fonts/main/ofl
          for f in blackhansans/BlackHanSans-Regular.ttf dohyeon/DoHyeon-Regular.ttf gowunbatang/GowunBatang-Bold.ttf gowunbatang/GowunBatang-Regular.ttf; do
            curl -fsSL "$B/$f" -o "app/src/main/assets/fonts/$(basename $f)" || echo "skip $f"
          done
          ls -la app/src/main/assets/fonts
      - run: chmod +x gradlew && ./gradlew assembleRelease --stacktrace
      - run: |
          cp app/build/outputs/apk/release/app-release.apk kuvis.apk
          cp notify/build/outputs/apk/release/notify-release.apk kuvis-notify-helper.apk
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: 쿠비스 3.1.${{ github.run_number }}
          body: ${{ github.event.head_commit.message }}
          files: kuvis.apk
          make_latest: true
      # 알림 도우미는 따로 (본체 업데이트와 섞이지 않게)
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: notify-helper
          name: 쿠비스 알림 도우미
          body: 쿠비스 알림 읽기·답장 도우미 앱. 컴퓨터로 한 번만 설치.
          files: kuvis-notify-helper.apk
          make_latest: false
